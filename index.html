<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FAQ</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .section-block { border: 1px solid #ccc; border-radius: 6px; margin-bottom: 20px; overflow: hidden; }
        .section-header { background: #f5f5f5; padding: 12px 16px; font-weight: bold; cursor: pointer; }
        .questions-list { list-style: none; margin: 0; padding: 0; display: none; }
        .questions-list.open { display: block; }
        .question-item { padding: 8px 16px; border-bottom: 1px solid #eee; }
        .question-btn { background: none; border: none; font-size: 16px; color: #0066cc; cursor: pointer; text-decoration: underline; }
        .answer-block { margin-top: 10px; padding: 12px; background: #fafafa; border: 1px dashed #ccc; border-radius: 4px; display: none; }
        .answer-block.visible { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <h1>Часто задаваемые вопросы</h1>

    <div id="faq-container"></div>

    <script>
        const faqData = {
            'Общие вопросы': [
                { q: 'Что такое FAQ?', a: 'FAQ (Frequently Asked Questions) — это раздел с часто задаваемыми вопросами и ответами на них.' },
                { q: 'Как мне связаться с поддержкой?', a: 'Напишите на support@example.com или позвоните по телефону +7 (XXX) XXX-XX-XX.' }
            ],
            'Регистрация и вход': [
                { q: 'Как зарегистрироваться?', a: 'Перейдите на страницу регистрации, заполните форму и подтвердите email.' },
                { q: 'Я забыл пароль. Что делать?', a: 'На странице входа нажмите «Забыли пароль» и следуйте инструкциям для сброса.' }
            ],
            'Оплата и заказы': [
                { q: 'Какие способы оплаты доступны?', a: 'Принимаем карты Visa/Mastercard, МИР, СБП и оплату по счёту.' },
                { q: 'Когда заказ считается оплаченным?', a: 'Заказ считается оплаченным после подтверждения банком транзакции.' }
            ]
        };

        const container = document.getElementById('faq-container');

        for (const sectionTitle in faqData) {
            const sectionBlock = document.createElement('div');
            sectionBlock.className = 'section-block';

            const header = document.createElement('div');
            header.className = 'section-header';
            header.textContent = sectionTitle;
            header.onclick = () => {
                const list = header.nextElementSibling;
                const isOpen = list.classList.contains('open');
                document.querySelectorAll('.questions-list').forEach(l => l.classList.remove('open'));
                document.querySelectorAll('.section-header').forEach(h => h.classList.remove('open'));
                if (!isOpen) {
                    header.classList.add('open');
                    list.classList.add('open');
                }
            };

            const list = document.createElement('ul');
            list.className = 'questions-list';

            faqData[sectionTitle].forEach(item => {
                const li = document.createElement('li');
                li.className = 'question-item';

                const btn = document.createElement('button');
                btn.className = 'question-btn';
                btn.textContent = item.q;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const answerBlock = li.querySelector('.answer-block');
                    const parentList = li.closest('.questions-list');
                    parentList.querySelectorAll('.answer-block').forEach(b => b.classList.remove('visible'));
                    if (!answerBlock.classList.contains('visible')) {
                        answerBlock.classList.add('visible');
                    }
                };

                const answer = document.createElement('div');
                answer.className = 'answer-block';
                answer.textContent = item.a;

                li.appendChild(btn);
                li.appendChild(answer);
                list.appendChild(li);
            });

            sectionBlock.appendChild(header);
            sectionBlock.appendChild(list);
            container.appendChild(sectionBlock);
        }
    </script>
</body>
</html>
